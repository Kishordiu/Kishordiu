<svg xmlns="http://www.w3.org/2000/svg" width="115" height="32" viewBox="0 0 115 32" role="img" aria-labelledby="title desc">
<title id="title">POSTGRESQL — ocean glass clay button</title>
<desc id="desc">Compact tactile button with a soft slate surface, subtle water sheen and a restrained coloured edge.</desc>
<defs>
  <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2A394A"/>
    <stop offset=".48" stop-color="#1D2B3D"/>
    <stop offset="1" stop-color="#132032"/>
  </linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8BE5E0" stop-opacity="0"/>
    <stop offset=".32" stop-color="#8BE5E0" stop-opacity=".16"/>
    <stop offset=".6" stop-color="#8DBBF1" stop-opacity=".22"/>
    <stop offset="1" stop-color="#8BE5E0" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="tint">
    <stop offset="0" stop-color="#6086C6" stop-opacity=".16"/>
    <stop offset="1" stop-color="#6086C6" stop-opacity="0"/>
  </radialGradient>
  <filter id="softClay" x="-20%" y="-35%" width="145%" height="185%">
    <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#020617" flood-opacity=".30"/>
  </filter>
  <clipPath id="surfaceClip">
    <rect x="3" y="3" width="109" height="26" rx="11"/>
  </clipPath>
</defs>
<rect x="3" y="3" width="109" height="26" rx="11" fill="url(#surface)" stroke="#6086C6" stroke-opacity=".56" stroke-width=".9" filter="url(#softClay)"/>
<g clip-path="url(#surfaceClip)">
  <ellipse cx="86.2" cy="12.2" rx="42.5" ry="30.4" fill="url(#tint)">
    <animate attributeName="cx" values="71.3;94.3;71.3" dur="9s" repeatCount="indefinite"/>
  </ellipse>
  <path d="M-34.5 0 H-16.1 L21.9 32 H3.4 Z" fill="url(#water)" opacity=".62">
    <animateTransform attributeName="transform" type="translate" values="0 0;151.8 0" dur="8.5s" repeatCount="indefinite"/>
  </path>
  <path d="M11 5 H104" stroke="#F1F5F9" stroke-opacity=".17" stroke-width=".8" stroke-linecap="round"/>
</g>
<rect x="4" y="4" width="107" height="24" rx="10" fill="none" stroke="#F1F5F9" stroke-opacity=".08" stroke-width=".7"/>
<rect x="8" y="7.0" width="18" height="18" rx="6" fill="#6086C6" fill-opacity=".17" stroke="#6086C6" stroke-opacity=".58" stroke-width=".8"/>
<text x="17.0" y="19.6" font-family="Arial,Helvetica,sans-serif" font-size="9.8" font-weight="700" text-anchor="middle" fill="#EAF1F8">Pg</text>
<text x="33" y="19.3" font-family="Arial,Helvetica,sans-serif" font-size="10.00" font-weight="700" letter-spacing=".28" fill="#E5EDF6">POSTGRESQL</text>
</svg>