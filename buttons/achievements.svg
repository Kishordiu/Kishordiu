<svg xmlns="http://www.w3.org/2000/svg" width="186" height="42" viewBox="0 0 186 42" role="img" aria-labelledby="title desc">
<title id="title">GITHUB ACHIEVEMENTS — ocean glass clay button</title>
<desc id="desc">Compact tactile button with a soft slate surface, subtle water sheen and a restrained coloured edge.</desc>
<defs>
  <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2A394A"/>
    <stop offset=".48" stop-color="#1D2B3D"/>
    <stop offset="1" stop-color="#132032"/>
  </linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8BE5E0" stop-opacity="0"/>
    <stop offset=".32" stop-color="#8BE5E0" stop-opacity=".16"/>
    <stop offset=".6" stop-color="#8DBBF1" stop-opacity=".22"/>
    <stop offset="1" stop-color="#8BE5E0" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="tint">
    <stop offset="0" stop-color="#8995A6" stop-opacity=".16"/>
    <stop offset="1" stop-color="#8995A6" stop-opacity="0"/>
  </radialGradient>
  <filter id="softClay" x="-20%" y="-35%" width="145%" height="185%">
    <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#020617" flood-opacity=".30"/>
  </filter>
  <clipPath id="surfaceClip">
    <rect x="3" y="3" width="180" height="36" rx="13"/>
  </clipPath>
</defs>
<rect x="3" y="3" width="180" height="36" rx="13" fill="url(#surface)" stroke="#8995A6" stroke-opacity=".56" stroke-width=".9" filter="url(#softClay)"/>
<g clip-path="url(#surfaceClip)">
  <ellipse cx="139.5" cy="16.0" rx="68.8" ry="39.9" fill="url(#tint)">
    <animate attributeName="cx" values="115.3;152.5;115.3" dur="9s" repeatCount="indefinite"/>
  </ellipse>
  <path d="M-55.8 0 H-26.0 L35.3 42 H5.6 Z" fill="url(#water)" opacity=".62">
    <animateTransform attributeName="transform" type="translate" values="0 0;245.5 0" dur="8.5s" repeatCount="indefinite"/>
  </path>
  <path d="M13 5 H173" stroke="#F1F5F9" stroke-opacity=".17" stroke-width=".8" stroke-linecap="round"/>
</g>
<rect x="4" y="4" width="178" height="34" rx="12" fill="none" stroke="#F1F5F9" stroke-opacity=".08" stroke-width=".7"/>
<rect x="10" y="10.0" width="22" height="22" rx="7" fill="#8995A6" fill-opacity=".17" stroke="#8995A6" stroke-opacity=".58" stroke-width=".8"/>
<text x="21.0" y="25.0" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#EAF1F8">★</text>
<text x="40" y="25.0" font-family="Arial,Helvetica,sans-serif" font-size="10.71" font-weight="700" letter-spacing=".28" fill="#E5EDF6">GITHUB ACHIEVEMENTS</text>
</svg>